<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>刻印の聖堂 — 拠点UI案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100f18;color:#e7e2db;font:16px/1.7 'Yu Gothic UI',Meiryo,sans-serif}button{font:inherit;cursor:pointer;color:inherit}header{display:flex;align-items:center;justify-content:space-between;padding:24px 5%;border-bottom:1px solid #39333f}h1{font-size:23px;margin:0;font-weight:500;letter-spacing:.15em}small,.muted{color:#a29ba9}header span{margin-left:26px;color:#d3bb83}.shell{max-width:1280px;margin:auto;padding:52px 5% 28px}.eyebrow{font-size:11px;letter-spacing:.23em;color:#bba572}main{display:grid;grid-template-columns:1.25fr 1fr;gap:72px;min-height:480px}.gate{position:relative;min-height:420px;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;border-bottom:1px solid #766245;background:#17141f;overflow:hidden}.arch{position:absolute;width:210px;height:320px;border:1px solid #514457;border-radius:110px 110px 0 0;top:38px;left:50%;transform:translateX(-50%)}.arch:after{content:'';position:absolute;inset:15px;border:1px solid #302939;border-radius:100px 100px 0 0}.gate h2{font-size:32px;letter-spacing:.15em;font-weight:500;margin:14px 0}.gate p{position:relative;color:#b0a6b8;font-size:14px;max-width:330px}.gate>div:last-child{position:relative;background:#17141f;padding-top:8px}.prep{padding-top:12px}.prep h2{font-size:16px;font-weight:500;margin:0 0 22px}.facility{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-top:1px solid #39333f;padding:23px 4px}.facility strong{font-size:19px;font-weight:500;display:block}.facility small{display:block;font-size:12px;margin-top:4px}.facility:hover{background:#211c2a}.facility b{color:#bba572;font-weight:400}.launch{margin-top:32px;background:#c3aa74;border:0;color:#201b17;width:100%;padding:18px;font-weight:700;font-size:18px}.launch:hover{background:#dfc58f}.status{font-size:12px;text-align:center;color:#a29ba9;margin-top:10px}footer{display:flex;justify-content:space-between;border-top:1px solid #39333f;margin-top:36px;padding-top:18px;font-size:12px}footer button{border:0;background:none;color:#aaa1b2;padding:4px 12px}.note{font-size:12px;color:#81798a;margin-top:30px}dialog{background:#1b1723;color:#e7e2db;border:1px solid #66583f;padding:30px;width:520px;max-width:92vw}dialog::backdrop{background:#050409c9}dialog h2{font-size:22px;margin:0 0 10px}dialog p{font-size:13px;color:#b2a9bc}.close{float:right;background:none;border:0;color:#b2a9bc}.floors{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.floors button{background:#292230;border:1px solid #514658;min-width:68px;padding:12px}.floors button.active{border-color:#d3bb83;color:#e8d5a9;background:#3c332a}.resume{width:100%;padding:16px;background:#292230;border:1px solid #66583f;text-align:left}.divider{font-size:12px;color:#aaa1b2;margin-top:24px}#detail .launch{margin-top:16px}@media(max-width:760px){main{grid-template-columns:1fr;gap:28px}.gate{min-height:300px}.shell{padding-top:24px}header{align-items:flex-start}header span{display:block;font-size:12px}h1{font-size:19px}footer{gap:12px;flex-wrap:wrap}}
</style>
<header><h1>刻印の聖堂</h1><div><span>魔石　5,273</span><span>貯金　4,514</span></div></header>
<div class="shell"><main><section class="gate"><div class="arch" aria-hidden="true"></div><div><div class="eyebrow">SANCTUM / 拠点</div><h2>次の探索に備える</h2><p>持ち帰った力を整え、再び塔へ。</p></div></section><section class="prep"><h2>探索の準備</h2>
<button class="facility" data-title="装備・倉庫" data-copy="レリックの装備と保管、素材の確認をこの画面に集約します。倉庫の所持数はここで表示。"><div><strong>装備・倉庫</strong><small>レリックを選び、持ち物を整える</small></div><b>→</b></button>
<button class="facility" data-title="商店・開発" data-copy="購入とレリック開発をタブで切り替える案です。貯金の操作がある場合もこの中に置きます。"><div><strong>商店・開発</strong><small>物資の購入とレリックの開発</small></div><b>→</b></button>
<button class="facility" data-title="パーティ" data-copy="ステータスを確認する画面です。修復屋への入口もここにまとめ、修復そのものは既存の施設へつなぐ案です。"><div><strong>パーティ</strong><small>能力の確認・修復屋へ</small></div><b>→</b></button>
<button class="launch" id="depart">塔へ向かう　→</button><div class="status">中断中の探索あり · 6階</div>
</section></main><footer><div>帰還中 · 探索の準備ができます</div><div><button data-title="探索記録" data-copy="挑戦回数 74 ／ 踏破 11 ／ 帰還 0 ／ 最高進行 134ノード。拠点で常時表示せず、見たいときに開きます。">探索記録</button><button data-title="図鑑" data-copy="解放済み 17 / 56。図鑑が使用できるようになった時点で入口を表示します。未実装なら拠点には表示しません。">図鑑</button></div></footer><p class="note">UI検討用モック / 数値は添付画面の例。施設は説明のみ、出発先は選択できます。ゲーム本体やセーブには接続していません。背景の門は仮の図形です。</p></div>
<dialog id="travel"><button class="close" aria-label="閉じる">閉じる ×</button><h2>塔へ向かう</h2><p>中断中の探索があります。戻る場所を選んでください。</p><button class="resume" id="resume">中断地点へ戻る　<span style="float:right">6階 →</span></button><div class="divider">出発階を選ぶ</div><div class="floors" id="floors"></div><p>中断中は刻印・レリックを引き継いで探索を続けます。<br>この例は回復済みの帰還状態：HP満タン・狂気0。</p><button class="launch" id="confirm">1階から続ける →</button><p id="feedback" aria-live="polite"></p></dialog>
<dialog id="detail"><button class="close" aria-label="閉じる">閉じる ×</button><h2 id="detailTitle"></h2><p id="detailCopy"></p></dialog>
<script>
const travel=document.querySelector('#travel'),detail=document.querySelector('#detail'),confirmButton=document.querySelector('#confirm'),feedback=document.querySelector('#feedback');
document.querySelector('#depart').onclick=()=>{feedback.textContent='';travel.showModal()};document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
[1,3,6,9,10,12,15,18].forEach((f,i)=>{const b=document.createElement('button');b.textContent=f+'階';b.className=i===0?'active':'';b.setAttribute('aria-pressed',i===0?'true':'false');b.onclick=()=>{document.querySelectorAll('.floors button').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');confirmButton.textContent=f+'階から続ける →';feedback.textContent=''};document.querySelector('#floors').append(b)});
confirmButton.onclick=()=>feedback.textContent='選択を受け付けました（UIモックのため探索は開始しません）。';document.querySelector('#resume').onclick=()=>feedback.textContent='中断地点の6階へ戻る操作です（UIモック）。';document.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>{document.querySelector('#detailTitle').textContent=b.dataset.title;document.querySelector('#detailCopy').textContent=b.dataset.copy;detail.showModal()});
</script></html>
