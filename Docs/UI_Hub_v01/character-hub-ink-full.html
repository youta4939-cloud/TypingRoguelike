<style>
*{box-sizing:border-box}body{margin:0;background:#171619;color:#eee8dc;font-family:'Yu Mincho','Hiragino Mincho ProN',serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d8b6a2;outline-offset:5px}.screen{height:100svh;min-height:680px;position:relative;overflow:hidden;background:#211e20}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;mask-image:linear-gradient(to right,transparent 28%,#000 46%);opacity:.92}.veil{position:absolute;inset:0;background:linear-gradient(to right,#211e20 0%,#211e20eb 25%,transparent 57%);pointer-events:none}.top{position:absolute;top:0;width:100%;height:106px;background:linear-gradient(#211e20 70%,#211e2000);display:flex;justify-content:space-between;align-items:flex-start;padding:25px 4%;z-index:2}.brand{font-size:26px;letter-spacing:.16em}.brand small{display:block;font:10px sans-serif;letter-spacing:.28em;color:#a99e98;margin-top:9px}.money{font-size:16px;letter-spacing:.08em;display:flex;gap:30px;padding-top:6px}.money small{font-size:12px;color:#b5aaa3;margin-right:9px}nav{position:absolute;left:7%;top:23%;width:29%;max-width:430px}nav button{display:block;border:0;background:none;text-align:left;padding:16px 0;width:100%;font-size:25px;letter-spacing:.12em;position:relative;color:#c8bfb6;transition:color .2s,transform .2s}nav button:hover,nav button:focus-visible{color:#fff6e5;transform:translateX(7px)}nav button:before{content:'◇';position:absolute;left:-31px;font-size:15px;top:25px;color:#b87878;opacity:0}nav button:hover:before,nav button:focus-visible:before{opacity:1}nav .primary{font-size:44px;color:#f6eddf;padding-top:0;padding-bottom:12px;border-bottom:1px solid #8f5b5c;margin-bottom:6px}nav .primary:before{top:18px}.status{font-size:12px;color:#b9a79f;letter-spacing:.08em;margin:0 0 30px}.caption{min-height:54px;font:13px/1.8 'Yu Gothic UI',sans-serif;color:#c3b5a9;margin-top:25px;max-width:320px}.bottom{position:absolute;bottom:0;width:100%;padding:18px 4%;background:#211e20e8;display:flex;align-items:center;justify-content:space-between;gap:20px;font:11px/1.6 sans-serif;color:#a99e98}.bottom button{background:none;border:0;padding:4px;color:#c9bfb3;font-size:13px}.credit{max-width:68%;text-align:right}dialog{background:#242226;color:#eee8dc;border:1px solid #74625d;width:min(680px,92vw);max-height:90svh;padding:30px;box-shadow:0 25px 100px #0009}dialog::backdrop{background:#0b0b10bd;backdrop-filter:blur(5px)}dialog h2{font-size:27px;font-weight:400;letter-spacing:.12em;margin:4px 0 14px}.close{float:right;background:none;border:0;color:#bdb0a6;padding:5px}.sub{font:13px/1.8 sans-serif;color:#c0b3a9}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.choice{background:#302b2e;border:1px solid #605354;padding:28px 14px;text-align:left;font-size:24px}.choice:hover{border-color:#d7b69b;background:#3b3133}.choice small{display:block;font:12px/1.7 sans-serif;color:#bdafa4;margin-top:12px}.panel{background:#353439;border:1px solid #757277;padding:24px;max-width:350px;margin:18px auto}.indicator{background:#14181a;color:#dcb37b;text-align:center;font:22px monospace;letter-spacing:.12em;padding:14px;margin-bottom:22px;min-height:54px}.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.floor{border-radius:50%;width:58px;height:58px;margin:auto;background:#48474b;border:2px solid #858187;font:18px sans-serif;box-shadow:inset 0 -3px 3px #0006}.floor:disabled{color:transparent;background:#333237;border-color:#4b484e;cursor:default;box-shadow:none}.floor.selected{border-color:#e4c093;color:#ffe6b5;background:#73583b;box-shadow:0 0 15px #daac6940}.door{display:flex;justify-content:center;gap:22px;margin-top:25px}.door button{border:1px solid #9a9291;background:#464247;padding:13px 24px;font-size:20px}.door button:disabled{opacity:.35;cursor:default}.hint{font:11px/1.8 sans-serif;color:#ac9d92;text-align:center}.wide{width:100%;background:#a88770;color:#211e20;border:0;padding:14px;font-size:18px;margin-top:18px}#arrive{font:13px/1.8 sans-serif;color:#e2c7a8;text-align:center;min-height:24px}.tag{display:inline-block;border:1px solid #77625d;padding:3px 9px;font:11px sans-serif;color:#d3b9a5}.detail-row{border-top:1px solid #4b4041;padding:16px 0;font:14px/1.8 sans-serif}.room-shift .art{filter:brightness(1.07);transition:filter .35s}@media(max-width:750px){.screen{min-height:700px}.art{object-position:65% center;opacity:.55;mask-image:linear-gradient(to right,transparent,#000 75%)}.veil{background:linear-gradient(to right,#211e20f5,#211e2090 65%,transparent)}nav{left:10%;width:70%;top:24%}nav button{font-size:23px}nav .primary{font-size:38px}.money{font:12px sans-serif;gap:8px;flex-direction:column}.brand{font-size:22px}.credit{max-width:72%;font-size:10px}}
.screen{background:#1b1c1e}.art{mask-image:none;opacity:1}.veil{background:linear-gradient(to right,#17191bc9 0%,#17191b70 30%,transparent 55%)}.top{background:linear-gradient(#181a1de8,transparent)}.bottom{background:#17191bcc}</style><link rel="stylesheet" href="character-hub-framed.css">
<link rel="stylesheet" href="character-hub-ink.css"><link rel="stylesheet" href="character-hub-ink-full.css"><div class="screen" id="screen"><figure class="illustration"><div class="image-mat"><img class="art" src="character-room-dark-v2.png" alt="雨の街を望む部屋で休息する探索者"></div><figcaption><span class="scene-name">探索の合間</span><span class="scene-sub">帰還中<br>次の出発まで、ここで。</span></figcaption><p class="scene-note">窓を叩く雨音だけが、部屋に残っている。</p></figure><div class="veil"></div><header class="top"><div class="brand">探索拠点<small>BASE / EXPLORATION</small></div><div class="money"><span><small>魔石</small>5,273</span><span><small>貯金</small>4,514</span></div></header>
<nav aria-label="拠点メニュー"><button class="primary" data-key="tower"><span class="label">塔へ行く</span><span class="index" aria-hidden="true">01</span></button><p class="status">中断中の探索あり · 6階</p><button data-key="gear"><span class="label">装備・倉庫</span><span class="index" aria-hidden="true">02</span></button><button data-key="shop"><span class="label">商店・開発</span><span class="index" aria-hidden="true">03</span></button><button data-key="party"><span class="label">パーティ</span><span class="index" aria-hidden="true">04</span></button><button data-key="record"><span class="label">探索記録</span><span class="index" aria-hidden="true">05</span></button><p class="caption" id="caption">探索の準備を整える。</p></nav><footer class="bottom"><button data-key="settings">設定</button><div class="credit">DESIGN STUDY / 墨と朱・フルアート案<br>操作はサンプル。キャラ差分・ランダム表示は未実装。</div></footer></div>
<dialog id="entrance"><button class="close" aria-label="閉じる">戻る ×</button><span class="tag">TOWER ENTRANCE</span><h2>塔の入口</h2><p class="sub">階段かエレベーターを選んでください。</p><div class="choices"><button class="choice" id="stairs">階段<small>1層から探索を続ける</small></button><button class="choice" id="lift">エレベーター<small>解放した層へ移動する</small></button></div><p class="sub">中断中の探索の刻印・レリックを引き継ぎます。</p><p id="stairResult" class="sub" aria-live="polite"></p></dialog>
<dialog id="elevator"><button class="close" aria-label="塔の入口へ戻る">入口へ戻る ×</button><h2>エレベーター</h2><p class="sub">行き先を選び、「閉」で移動開始。</p><div class="panel"><div class="indicator" id="indicator" aria-live="polite">行き先を選択</div><div class="floors" id="floors"></div><div class="door"><button id="openDoor" aria-label="開 扉を開く">◁ ▷<br><small>開</small></button><button id="closeDoor" disabled aria-label="閉 選択した層へ移動">▷ ◁<br><small>閉</small></button></div></div><p class="hint">数字のないボタンは未解放です。</p><p id="arrive" aria-live="polite"></p></dialog>
<dialog id="detail"><button class="close" aria-label="閉じる">閉じる ×</button><span class="tag">PREVIEW</span><h2 id="detailTitle"></h2><div id="detailBody"></div><p class="sub">この画面は配置と遷移を確認するためのサンプルです。</p></dialog>
<script>
const $=s=>document.querySelector(s),screen=$('#screen'),entrance=$('#entrance'),elevator=$('#elevator'),detail=$('#detail');
const entries={tower:['塔へ行く','塔の入口へ。階段かエレベーターを選ぶ。'],gear:['装備・倉庫','持ち帰った道具を整理し、装備を整える。'],shop:['商店・開発','物資を買い足し、レリックを開発する。'],party:['パーティ','仲間の状態を確認し、次の探索に備える。'],record:['探索記録','これまでの探索と、その成果を振り返る。'],settings:['設定','音量・表示などの設定画面。']};
const bodies={gear:'レリックの装備・保管<br>素材倉庫 4 ／ レリック倉庫 24個',shop:'商店　｜　レリック開発<br>必要な物資の購入や開発を行う画面へ。',party:'パーティの能力を確認<br>修復屋への入口もここにまとめる案。',record:'挑戦回数　74<br>踏破 ／ 帰還　11 ／ 0<br>最高進行　134ノード',settings:'音量・表示などの設定項目を配置する想定。'};
let timer;document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const preview=()=>{clearTimeout(timer);timer=setTimeout(()=>{$('#caption').textContent=entries[k][1];screen.classList.add('room-shift')},150)};b.addEventListener('mouseenter',preview);b.addEventListener('focus',preview);b.addEventListener('mouseleave',()=>{clearTimeout(timer);screen.classList.remove('room-shift')});b.addEventListener('blur',()=>{clearTimeout(timer);screen.classList.remove('room-shift')});b.onclick=()=>{if(k==='tower'){$('#stairResult').textContent='';entrance.showModal();return}$('#detailTitle').textContent=entries[k][0];$('#detailBody').innerHTML='<div class="detail-row">'+bodies[k]+'</div>';detail.showModal()}});
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());$('#stairs').onclick=()=>$('#stairResult').textContent='1層へ出発します。（サンプルのため、実際の探索は開始しません）';
let selected=null,moving=false,travelTimer;const unlocked=new Set([1,3,6,9,10,12,15,18]);
function resetLift(){clearTimeout(travelTimer);moving=false;selected=null;$('#indicator').textContent='行き先を選択';$('#arrive').textContent='';$('#closeDoor').disabled=true;document.querySelectorAll('.floor').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false');b.disabled=!unlocked.has(Number(b.dataset.floor))})}
$('#lift').onclick=()=>{resetLift();elevator.showModal()};
for(let f=18;f>=1;f--){const b=document.createElement('button');b.className='floor';b.dataset.floor=f;b.disabled=!unlocked.has(f);b.textContent=unlocked.has(f)?f:'';b.setAttribute('aria-label',unlocked.has(f)?f+'層':'未解放');b.setAttribute('aria-pressed','false');b.onclick=()=>{if(moving)return;selected=f;document.querySelectorAll('.floor').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true');$('#indicator').textContent=f+' 層';$('#closeDoor').disabled=false;$('#arrive').textContent=''};$('#floors').append(b)}
$('#closeDoor').onclick=()=>{if(selected===null||moving)return;moving=true;$('#closeDoor').disabled=true;document.querySelectorAll('.floor').forEach(b=>b.disabled=true);$('#indicator').textContent='扉が閉まります';$('#arrive').textContent=selected+'層へ移動中…';travelTimer=setTimeout(()=>{$('#indicator').textContent=selected+' 層 / 到着';$('#arrive').textContent='到着しました。ここから探索へ進む想定です。';moving=false},1400)};$('#openDoor').onclick=()=>{resetLift();$('#indicator').textContent='扉が開きました'};elevator.addEventListener('close',resetLift);

const menuItems=[...document.querySelectorAll('nav [data-key]')];
function selectMenu(button){menuItems.forEach(item=>item.classList.toggle('active',item===button))}
menuItems.forEach(button=>{button.addEventListener('mouseenter',()=>selectMenu(button));button.addEventListener('focus',()=>selectMenu(button));button.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const i=menuItems.indexOf(button),step=event.key==='ArrowDown'?1:-1;menuItems[(i+step+menuItems.length)%menuItems.length].focus()}})});
selectMenu(menuItems[0]);
</script></html>
